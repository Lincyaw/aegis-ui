name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Verify tag matches packages/ui version
        run: |
          PKG_VERSION=$(node -p "require('./packages/ui/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/ui/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build library
        run: pnpm -F @lincyaw/aegis-ui build

      # Trusted Publishing (OIDC) needs npm >= 11.5.1.
      - name: npm version
        run: npm --version

      # npm tries Trusted Publishing first and falls back to NODE_AUTH_TOKEN,
      # so this works with either an npm trusted publisher or an NPM_TOKEN secret.
      - name: Publish to npmjs.com
        working-directory: packages/ui
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
